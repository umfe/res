name: Publish to NPM

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: publish-npm
    cancel-in-progress: false
    queue: max

jobs:
    publish:
        runs-on: ubuntu-latest
        if: "github.ref_name == 'main' && !contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Bump version
              id: bump
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  LATEST=$(npm view "$NAME" version 2>/dev/null || true)
                  if [ -n "$LATEST" ]; then
                    npm version "$LATEST" --no-git-tag-version --allow-same-version
                  fi
                  npm version patch --no-git-tag-version
                  pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Publish to NPM
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                    echo "::error::NODE_AUTH_TOKEN is empty. Please check that you have added NPM_TOKEN to your GitHub repository secrets."
                    exit 1
                  fi
                  npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Commit and Push Version Bump
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'chore: release v${{ steps.bump.outputs.version }} [skip ci]'
                  branch: ${{ github.ref_name }}
                  file_pattern: 'package.json pnpm-lock.yaml'
